[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embryofusion"
version = "1.0.0"
description = "Multimodal fusion of clinical records and embryo images for IVF outcome prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "torch>=2.2", "transformers>=4.40", "wandb>=0.17",
    "opencv-python-headless>=4.9", "matplotlib>=3.8", "pyyaml>=6.0", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["data: fast unit tests of the data processing layer", "slow: tests that train a model"]

[tool.ruff]
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E702"]
